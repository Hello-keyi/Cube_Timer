server:
  port: 8081

spring:
  profiles:
    active: dev
  servlet:
    multipart:
      max-file-size: 5MB        # 单个文件最大 5MB
      max-request-size: 10MB    # 一次请求最大 10MB

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

# 接口文档：通用配置默认关闭，仅在 dev 打开（生产暴露接口地图是安全风险）
springdoc:
  api-docs:
    enabled: false
